
name: nancy_app
description: Aplicativo NANCY - Sistema Integral de Inscripciones
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.6

  flutter_localizations:
    sdk: flutter

  flutter_local_notifications: ^19.5.0

  open_filex: ^4.7.0

  timezone: ^0.10.1

  # ICONOS
  cupertino_icons: ^1.0.8

  # GESTIÓN DE ESTADO
  provider: ^6.1.5

  # NAVEGACIÓN
  go_router: ^16.2.1

  # BASE DE DATOS SQLITE
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # PERSISTENCIA LOCAL
  shared_preferences: ^2.5.5

  # TIPOGRAFÍA
  google_fonts: ^6.3.0

  # CONECTIVIDAD
  connectivity_plus: ^7.3.1
  internet_connection_checker_plus: ^2.9.0

  # UTILIDADES
  uuid: ^4.5.1
  intl: ^0.20.2
  logger: ^2.6.1
  share_plus: ^12.0.2
  archive: 3.6.1

  # SEGURIDAD
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # FOTOGRAFÍA
  image_picker: ^1.2.1

  # EXPORTACIONES
  excel: ^4.0.6
  pdf: ^3.12.0
  file_picker: 10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # GENERACIÓN DEL ICONO DE NANCY
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/data/

# CONFIGURACIÓN DEL ICONO DE LA APLICACIÓN
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
